<!DOCTYPE html>
<html>
<head>
    <title>Location Search</title>

    <style>
        body {
            font-family: Arial;
            background: #eee;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 450px;
            padding: 25px;
            border-radius: 10px;
        }

        h2, .identitas {
            text-align: center;
        }

        .search {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #30258f;
            color: white;
            border: 0;
            border-radius: 5px;
        }

        .data {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
        }

        #pesan {
            color: red;
            text-align: center;
        }
    </style>
</head>
